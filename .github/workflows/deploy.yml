name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Only one deploy at a time; cancel any in-flight run when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm is the package manager this project locks with (pnpm-lock.yaml);
      # the npm lock was stale, so `npm ci` resolved a tree without the icon
      # pack. No `version:` here on purpose — pnpm/action-setup reads the
      # pinned version from package.json's `packageManager` field, and passing
      # both is an error. Install it before setup-node so the cache can key on
      # the pnpm store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed on. Node 20 still
          # satisfies Vite's `^20.19.0 || >=22.12.0`, but it is deprecated on
          # the runners, so the build targets 22 (current LTS).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
